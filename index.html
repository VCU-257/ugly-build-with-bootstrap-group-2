<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

  <title>Home</title>
</head>
<body>

  <!-- Top Navbar (For Desktop) -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">CreditBrand</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Plans</a></li>
          <li class="nav-item"><a class="nav-link" href="account-info.html">Account</a></li>
          <li class="nav-item"><a class="nav-link" href="Finances.html">Finances</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Learning</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Customer Service</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container mt-4">

    <!-- Welcome -->
    <div class="text-center mb-4">
      <h4>Welcome Dear User!</h4>
    </div>

    <!-- Main Actions -->
    <div class="row text-center mb-4">
      <div class="col">
        <button class="btn btn-outline-primary w-100">
          <i class="bi bi-wallet"></i><br>
          Finance
        </button>
      </div>
      <div class="col">
        <button class="btn btn-outline-primary w-100">
          <i class="bi bi-person"></i><br>
          Accounts
        </button>
      </div>
      <div class="col">
        <button class="btn btn-outline-primary w-100">
          <i class="bi bi-credit-card"></i><br>
          Cards
        </button>
      </div>
      <div class="col">
        <button class="btn btn-outline-primary w-100">
          <i class="bi bi-cash"></i><br>
          Loans
        </button>
      </div>
    </div>

    <!-- Credit Score Section -->
    <div class="card text-center">
      <div class="card-body" style="height: 300px;">
        <h5 class="mb-3">Your Credit Score</h5>
        <p class="display-2">720</p>
        <p class="text-muted">Good standing</p>
        <p class="small">
          This score is based on your overall credit activity.
          View more details in the Finances section.
        </p>
      </div>
    </div>

  </div>

  <!-- Mobile Bottom Nav -->
  <nav class="navbar fixed-bottom navbar-light bg-light d-lg-none">
    <div class="container-fluid justify-content-around text-center">

      <a class="navbar-text text-center" href="index.html">
        <div><i class="bi bi-house"></i></div>
        <small>Home</small>
      </a>

      <a class="navbar-text text-center" href="Finances.html">
        <div><i class="bi bi-bar-chart"></i></div>
        <small>Stats</small>
      </a>

      <a class="navbar-text text-center" href="account-info.html">
        <div><i class="bi bi-credit-card"></i></div>
        <small>Cards</small>
      </a>

    </div>
  </nav>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

</html>
