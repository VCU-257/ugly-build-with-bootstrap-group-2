<style>
:root {
    --background: #ffffff;
    --secondary: #C5E8F1;
    --text: #1E1E1E;
}

.bottom-navbar{
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background-color: var(--background);
    color: var(--text);
    padding: 10px 0;
    z-index: 1000;
}
.bottom-navbar .nav-item {
    display: inline-block;
    margin: 0 15px;
}

.top-navbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    background-color: none;
    color: var(--text);
    padding: 10px 0;
    z-index: 1000;
}
.top-navbar .nav-item {
    display: inline-block;
    margin: 0 15px;
}
.active{
    border-radius: 20px;
    box-shadow: 0px 2px 2px rgba(0, 0, 0, 0.1);
    background: var(--secondary);
}
body {
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0;
  background: var(--background);
  font-family: Arial, Helvetica, sans-serif; 
}

.box{
    background: var(--background);
    color: var(--text);
    border: 1px solid var(--text);
    padding: 20px;
    margin: 10px;
    border-radius: 20px;
    height: 12vh;
    width: 10vh;
}
.fico{
    border: #1E1E1E 1px solid;
    border-radius: 100px;
    height: 25vh;
    width: 25vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}
.container{
    align-items: center;
    justify-content: center;
}
.main{
    margin-top: 15vh;
}
.breadcrumb-mb{
    padding-top: 5px;
}
.bread{
    color: var(--text);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding-left: 10px;
    font-weight: lighter;
    font-size: smaller;
}

</style>
