                        Home 
                        <svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" fill="currentColor" class="bi bi-caret-right-fill" viewBox="0 0 16 16">

                        </svg>
                        Edit Account Information
                    </a>
                </div>
            </nav>
        </nav>
        <div class="container main p-4">
            <form>
                <div class="mb-4">
                    <h3 class="fw-bold">Credit Accounts</h3>

                    <fieldset class="account-1">
                        <h5 class="mt-3">Capital One Quicksilver Credit Card</h5>
                        <div class="row align-items-center mb-3">
                            <div class="col-6">
                                <label class="form-label mb-0">Credit Limit</label>
                            </div>
                            <div class="col input-group">
                                <span class="input-group-text">$</span>
                                <input type="number" class="form-control" min="0" min="0">
                            </div>
                        </div>

                        <div class="row align-items-center mb-3">
                            <div class="col-6">
                                <label class="form-label mb-0">Credit Used</label>
                            </div>
                            <div class="col input-group">
                                <span class="input-group-text">$</span>
                                <input type="number" class="form-control" min="0">
                            </div>
                        </div>

                        <div class="row align-items-center mb-3">
                            <div class="col-6">
                                <label class="form-label mb-0">APR</label>
                            </div>
                            <div class="col input-group">
                                <input type="number" class="form-control" min="0">
                                <span class="input-group-text">%</span>
                            </div>
                        </div>

                        <div class="row align-items-center mb-3">
                            <div class="col-6">
                                <label class="form-label mb-0">Account Age</label>
                            </div>
                            <div class="col input-group">
                                <input type="number" class="form-control" min="0">
                                <span class="input-group-text">Months</span>
                            </div>
                        </div>
                    </fieldset>

                    <fieldset class="account-2">
                        <h5 class="mt-3">Subsidized Student Loan Account</h5>

                        <div class="row align-items-center mb-3">
                            <div class="col-6">
                                <label class="form-label mb-0">Principal</label>
                            </div>
                            <div class="col input-group">
                                <span class="input-group-text">$</span>
                                <input type="number" class="form-control" min="0">
                            </div>
                        </div>

                        <div class="row align-items-center mb-3">
                            <div class="col-6">
                                <label class="form-label mb-0">Balance</label>
                            </div>
                            <div class="col input-group">
                                <span class="input-group-text">$</span>
                                <input type="number" class="form-control" min="0">
                            </div>

                        </div>

                        <div class="row align-items-center mb-3">
                            <div class="col-6">
                                <label class="form-label mb-0">APR</label>
                            </div>
                            <div class="col input-group">
                                <input type="number" class="form-control" min="0">
                                <span class="input-group-text">%</span>
                            </div>
                        </div>

                        <div class="row align-items-center mb-3">
                            <div class="col-6">
                                <label class="form-label mb-0">Account Age</label>
                            </div>
                            <div class="col input-group">
                                <input type="number" class="form-control" min="0">
                                <span class="input-group-text">Months</span>
                            </div>
                        </div>
                    </fieldset>

                    <!-- Later, this button will add another account info form section -->
                    <button type="button" class="btn btn-link ps-0">
                        <i class="bi bi-plus-circle me-2"></i>Add Credit Account
                    </button>
                </div>

                <div class="mb-4">
                    <h3 class="fw-bold">Other</h3>

                    <div class="row align-items-center mb-3">
                        <div class="col-6">
                            <label class="form-label mb-0">Annual Income</label>
                        </div>
                        <div class="col input-group">
                            <span class="input-group-text">$</span>
                            <input type="number" class="form-control" min="0">
                        </div>
                    </div>

                    <div class="row align-items-center mb-3">
                        <div class="col-6">
                            <label class="form-label mb-0">Rent</label>
                        </div>
                        <div class="col input-group">
                            <span class="input-group-text">$</span>
                            <input type="number" class="form-control" min="0">
                        </div>
                    </div>
                </div>

                <div class="text-center mt-4">
                    <button type="submit" class="btn btn-secondary px-5">
                        Save Changes
                    </button>
                </div>
            </form>
        </div>

                <small>
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-archive" viewBox="0 0 16 16">
